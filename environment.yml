name: project-d
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.12

  # System-level PDF extraction dependencies
  - poppler
  - tesseract
  - pandoc

  # Core pipeline
  - numpy
  - pandas
  - pip

  - pip:
    # Pipeline CLI and utilities
    - click
    - tqdm
    - coloredlogs
    - python-dotenv
    - ipykernel

    # PDF extraction
    - "unstructured[pdf]"

    # Embeddings and retrieval
    - sentence-transformers

    # Generation
    - transformers

    # Vector store: ChromaDB backend
    - chromadb

    # Vector store: pgvector backend
    - sqlalchemy>=2.0
    - pgvector
    - psycopg[binary]
    - alembic

    # Benchmark/report metrics
    - radon
    - pypdf

    # Tests
    - pytest
